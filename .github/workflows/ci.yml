name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint · Typecheck · Test · Accessibility · Performance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo lint

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Test
        run: pnpm turbo test

      - name: Build
        run: pnpm turbo build

      - name: Install Playwright browsers
        run: pnpm --filter @vedanta/web exec playwright install --with-deps chromium

      # Route-level a11y gate (session 1, T3): builds on `pnpm turbo build`
      # above — starts that build, runs axe-core against every real route.
      # 11 routes have a tracked, skipped violation — see docs/mistakes.md
      # (VG-004) and apps/web/e2e/a11y.spec.ts's KNOWN_FAILURES.
      - name: Accessibility gate (axe-core CI)
        run: pnpm --filter @vedanta/web exec playwright test

      # Session 1, T4: JS (gz) budget per route, from next build's own First
      # Load JS column — 120 KB marketing / 180 KB RFQ (CLAUDE.md). LCP/CLS/
      # INP are not gated yet: no real hero photography exists (C-6 open), so
      # an LCP assertion against placeholder imagery would be unrepresentative
      # rather than a real budget. Activate once real photography lands.
      - name: Performance budgets (JS size)
        run: node scripts/check-js-budget.mjs

      - name: Redirect map integrity
        run: node scripts/check-redirect-map-integrity.mjs

      - name: Redirect runtime test (301 checks)
        run: |
          pnpm --filter @vedanta/web start &
          SERVER_PID=$!
          echo "Waiting for server..."
          timeout 30 bash -c 'until curl -sf http://localhost:3000/ > /dev/null 2>&1; do sleep 2; done'
          node scripts/test-redirects.mjs
          kill $SERVER_PID
